<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a16"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with rounded squircle -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Outer Cyber Circuit Ring -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#00f0ff" stroke-width="6" stroke-opacity="0.4" stroke-dasharray="32 16"/>
  
  <!-- Circuit Traces -->
  <path d="M 64 256 L 140 256 L 180 200 L 230 200" fill="none" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.3"/>
  <circle cx="230" cy="200" r="5" fill="#00f0ff" opacity="0.6"/>

  <path d="M 448 256 L 372 256 L 332 312 L 282 312" fill="none" stroke="#ec4899" stroke-width="4" stroke-opacity="0.3"/>
  <circle cx="282" cy="312" r="5" fill="#ec4899" opacity="0.6"/>

  <!-- Glowing Inner Frame -->
  <rect x="76" y="76" width="360" height="360" rx="64" fill="#060e20" stroke="url(#cyanGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- Central "X" & Mathematical Plus/Minus Core -->
  <!-- Diagonal 1 -->
  <path d="M 160 160 L 352 352" stroke="url(#cyanGrad)" stroke-width="32" stroke-linecap="round"/>
  <!-- Diagonal 2 -->
  <path d="M 352 160 L 160 352" stroke="url(#magentaGrad)" stroke-width="32" stroke-linecap="round"/>

  <!-- Center Microchip Node -->
  <rect x="220" y="220" width="72" height="72" rx="16" fill="#020409" stroke="#00f0ff" stroke-width="6"/>
  
  <!-- Center Math Plus -->
  <path d="M 256 236 L 256 276 M 236 256 L 276 256" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>

  <!-- Top Display Bar Miniature -->
  <rect x="140" y="104" width="232" height="36" rx="8" fill="#020713" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.5"/>
  <circle cx="160" cy="122" r="4" fill="#22c55e"/>
  <line x1="280" y1="122" x2="350" y2="122" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
</svg>
